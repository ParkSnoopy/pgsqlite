[package]
name              = "pgsqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests         = false
default-run       = "pgsqlite"

[workspace]
members         = ["tests"]
default-members = [".", "tests"]
resolver        = "3"

[workspace.package]
version = "0.0.23"
edition = "2024"
license = "GPL-3.0-only"

[features]
default           = []
use_db_executor   = []
unified_processor = []

[dependencies]
# Async runtime
tokio              = { version = "1.46", features = ["full"] }
tokio-util         = { version = "0.7", features = ["codec"] }

# PostgreSQL protocol
bytes              = "1.9"
postgres-protocol  = "0.6"

# SQLite
rusqlite           = { version = "0.36", features = ["bundled", "uuid", "serde_json", "functions", "collation", "vtab", "column_decltype"] }

# SQL parsing
sqlparser          = { version = "0.57", features = ["serde", "visitor"] }

# Types
uuid               = { version = "1.11", features = ["v4", "serde"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
chrono             = "0.4"
rust_decimal       = { version = "1.35", features = ["serde", "db-postgres"] }
once_cell          = "1.20"

# PostgreSQL client (for testing)
tokio-postgres     = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
env_logger         = "0.11"

# Utilities
thiserror          = "2"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait        = "0.1"
rand               = "0.9"
futures            = "0.3"
hex                = "0.4"
regex              = "1.11"
byteorder          = "1.5"
parking_lot        = "0.12"
memchr             = "2.7"
itoa               = "1.0"
bitflags           = "2.6"
lru                = "0.16"

# Memory mapping for zero-copy operations
memmap2            = "0.9"
tempfile           = "3.14"

# Configuration
config             = "0.15"
clap               = { version = "4", features = ["derive", "env"] }
lazy_static        = "1"

# Cryptography for migration checksums
sha2               = "0.10"

# Metrics
prometheus         = "0.14"

# TLS/SSL support - using ring backend for cross-compilation compatibility
tokio-rustls       = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls             = { version = "0.23", default-features = false, features = ["logging", "tls12", "ring"] }
rustls-pemfile     = "2.2"
rcgen              = "0.13"

# ============================================
# RUST-MAGIC-LINTER (maximum preset)
# https://github.com/ParkSnoopy/rust-magic-linter
# ============================================
# MAXIMUM PROFILE
# Broad lint groups at deny level, with explicit relaxations below.
# See CONSTITUTION.md for design guidance and overrides.
# Add to Cargo.toml; use [workspace.lints.*] in workspace roots.
# clippy.toml configures thresholds but does not enable lints.

[lints.rust]
# Safety (forbid cannot be overridden by local lint attributes)
unsafe_code                   = "forbid"
non_ascii_idents              = "forbid"

# Quality enforcement
warnings                      = "deny"
rust_2018_idioms              = { level = "deny", priority = -1 }
future_incompatible           = { level = "deny", priority = -1 }
nonstandard_style             = { level = "deny", priority = -1 }

# Documentation enforcement
missing_docs                  = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations  = "deny"
unfulfilled_lint_expectations = "deny"

[lints.rustdoc]
all = { level = "deny", priority = -1 }

[lints.clippy]
# Lint groups (individual entries override priority -1 groups)
all                             = { level = "deny", priority = -1 }
pedantic                        = { level = "deny", priority = -1 }
nursery                         = { level = "deny", priority = -1 }
cargo                           = { level = "deny", priority = -1 }

# Panic restrictions (stricter than Google's invariant-panic guidance)
unwrap_used                     = "deny"              # Handle missing values and errors explicitly.
expect_used                     = "deny"              # Handle missing values and errors explicitly.
panic                           = "deny"                    # Do not call panic!() explicitly.
panic_in_result_fn              = "deny"        # Do not panic in functions returning Result.

# Lint suppression restrictions
allow_attributes                = "deny"         # Do not add #[allow(...)]; fix the cause.
allow_attributes_without_reason = "deny"  # Require reasons where allowances are permitted.

# Code hygiene
dbg_macro                       = "deny"                # Remove dbg!() calls.
todo                            = "deny"                     # Do not leave todo!() placeholders.
unimplemented                   = "deny"            # Do not leave unimplemented!() placeholders.
print_stdout                    = "deny"             # Use structured logging or explicit writers.
print_stderr                    = "deny"             # Use structured logging or explicit writers.

# Async safety
await_holding_lock              = "deny"       # Do not hold synchronous lock guards across await.
large_futures                   = "deny"            # Avoid excessively large futures.

# Process and memory safety
exit                            = "deny"                     # Return control rather than calling process::exit.
mem_forget                      = "deny"               # Do not bypass destructors with mem::forget.

# Performance
large_stack_arrays              = "deny"
large_types_passed_by_value     = "deny"

# Relaxations (design guidance still applies when a lint is disabled)
multiple_crate_versions         = "allow"   # Unavoidable with transitive deps

# Cast lints - too many false positives even for strict projects
cast_possible_truncation        = "allow"
cast_sign_loss                  = "allow"
cast_precision_loss             = "allow"
cast_possible_wrap              = "allow"

# Nursery lints that have too many false positives
cognitive_complexity            = "allow"      # Its clippy.toml threshold is inactive here.

[package]
name              = "pgsqlite-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish           = false

[dependencies]
pgsqlite           = { path = ".." }
bytes              = "1.9.0"
chrono             = "0.4.39"
clap               = { version = "4.5.25", features = ["derive", "env"] }
env_logger         = "0.11.5"
futures            = "0.3"
hex                = "0.4"
itoa               = "1.0"
rand               = "0.9"
rusqlite           = { version = "0.36.0", features = ["bundled", "uuid", "serde_json", "functions", "collation", "vtab", "column_decltype"] }
rust_decimal       = { version = "1.35.0", features = ["serde", "db-postgres"] }
serde_json         = "1.0.134"
sqlparser          = { version = "0.57.0", features = ["serde", "visitor"] }
tempfile           = "3.14.0"
tokio              = { version = "1.46", features = ["full"] }
tokio-postgres     = { version = "0.7.12", features = ["with-chrono-0_4", "with-serde_json-1"] }
tokio-util         = { version = "0.7.15", features = ["codec"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid               = { version = "1.11.0", features = ["v4", "serde"] }

[dev-dependencies]
criterion         = "0.6"
pretty_assertions = "1.4"
arbitrary         = "1.3"

[[bench]]
name    = "simple_query_bench"
path    = "performance/rust/simple_query_bench.rs"
harness = false

[[bin]]
name = "benchmark_pooling"
path = "performance/rust/benchmark_pooling.rs"

[[bin]]
name = "rusqlite_test"
path = "performance/rust/rusqlite_test.rs"

